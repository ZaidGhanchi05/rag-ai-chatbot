# render.yaml — Render.com deployment config for the FastAPI backend
# Free tier: https://render.com
# Deploy: connect GitHub repo → Render auto-detects this file
# After deploy, set GROQ_API_KEY in Render dashboard → Environment tab

services:
  - type: web
    name: rag-chatbot-backend
    runtime: python
    rootDir: .
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: TOP_K
        value: "5"
      - key: CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: UPLOAD_DIR
        value: "./data/uploads"
      - key: INDEX_DIR
        value: "./data/index"
      - key: GROQ_MODEL
        value: "llama-3.1-8b-instant"
      - key: GROQ_API_KEY
        sync: false   # set manually in Render dashboard — never commit API keys!
